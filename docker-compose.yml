services:
  gancook:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.5.0}
    image: gancook-custom:latest
    container_name: gancook
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      # 数据目录（SQLite + 上传图片）。备份只需复制 ./data
      - ./data:/data
    environment:
      # 全部可选。开箱即用，无需配置任何密钥（首次启动自动生成并持久化到 ./data）。
      TZ: Asia/Shanghai
